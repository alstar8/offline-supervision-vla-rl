profiles:
  tabletop_clear_shadows: # Базовый вариант с хорошо читаемыми тенями от руки и объектов.
    ambient_light: [0.22, 0.22, 0.22]
    clear_color: [0.62, 0.62, 0.62, 1.0]
    directional_lights: []
    point_lights:
      - position: [-0.10, -1.15, 1.60]
        color: [1.25, 1.25, 1.25]
        shadow: true
      - position: [0.35, -0.95, 1.40]
        color: [0.25, 0.25, 0.25]
        shadow: false

