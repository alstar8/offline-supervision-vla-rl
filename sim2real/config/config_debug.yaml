hand_visual_profiles:
  # Visual approximation of the real hand; linear RGB, not measured albedo.
  rc5_real_matte_v1: &rc5_real_matte_v1
    name: rc5_real_matte_v1
    materials:
      plastic:
        base_color: [0.45, 0.46, 0.41, 1.0]
        metallic: 0.0
        specular: 0.18
        roughness: 0.8
      pad:
        base_color: [0.04, 0.04, 0.035, 1.0]
        metallic: 0.0
        specular: 0.1
        roughness: 0.95
      adapter_green:
        base_color: [0.035, 0.22, 0.025, 1.0]
        metallic: 0.0
        specular: 0.15
        roughness: 0.85
      camera_metal:
        base_color: [0.5, 0.52, 0.54, 1.0]
        metallic: 0.8
        specular: 0.5
        roughness: 0.25
      camera_panel:
        base_color: [0.012, 0.014, 0.016, 1.0]
        metallic: 0.0
        specular: 0.4
        roughness: 0.3
    links:
      body6: plastic  # Light wrist ring between the black arm and green adapter.
      right_base_link: plastic
      right_t_link: plastic
      right_thumb_mcp_link: plastic
      right_thumb_proximal_link: plastic
      right_thumb_distal_link: plastic
      right_index_proximal_link: plastic
      right_index_middle_link: plastic
      right_index_distal_link: plastic
      right_middle_proximal_link: plastic
      right_middle_middle_link: plastic
      right_middle_distal_link: plastic
      right_ring_proximal_link: plastic
      right_ring_middle_link: plastic
      right_ring_distal_link: plastic
      right_pinky_proximal_link: plastic
      right_pinky_middle_link: plastic
      right_pinky_distal_link: plastic
      right_thumb_tip_link: pad
      right_index_tip_link: pad
      right_middle_tip_link: pad
      right_ring_tip_link: pad
      right_pinky_tip_link: pad
    # Original DAE: three green adapter parts and one camera housing.
    parts:
      prehand:
        - adapter_green
        - adapter_green
        - adapter_green
        - material: camera_metal
          expected_triangles: 6036
          regions:
            # Exposed -Z front, opposite the mount. Bounds in unscaled mesh mm.
            - material: camera_panel
              bounds_min: [-22, 46, 71.9]
              bounds_max: [22, 89, 73]
              expected_triangles: 1710

global:
  simulation:
    hand_visual_profile: *rc5_real_matte_v1
    physics: "default"
    object_material:
      static_friction: 0.5
      dynamic_friction: 0.5
      restitution: 0.0
    lighting:
      # настройки общего света, у настроек в local преимущество
      # Равномерная фоновая засветка всей сцены.
      # Если кадр в целом слишком темный или слишком контрастный, сначала менять именно это.
      ambient_light: [0.35, 0.35, 0.35]

      # Цвет "пустого" фона рендера там, где нет геометрии.
      # На нашу сцену влияет слабо, но полезен для согласованности viewer/rgb_array.
      clear_color: [0.62, 0.62, 0.62, 1.0]

      # Направленный свет по всей сцене.
      # Сейчас отключен, потому что для этой tabletop-сцены лучше работает локальный верхний свет.
      directional_lights: []

      point_lights:
        # Основной источник света над столом.
        # Имитирует потолочную лампу над рабочей зоной.
        # shadow: true нужен, чтобы получить тени и сделать картинку ближе к реальной.
        - position: [-0.10, -1.15, 1.60]
          color: [1.2, 1.2, 1.2]
          shadow: true

        # Слабый заполняющий свет.
        # Немного подсвечивает сцену сбоку и смягчает слишком жесткие тени.
        # Обычно его лучше держать без теней.
        - position: [0.35, -0.95, 1.40]
          color: [0.45, 0.45, 0.45]
          shadow: false
    video:
      # Параметры записи debug-видео из base_camera.
      #
      # Быстрый локальный просмотр, минимальный размер:
      # format: "mp4"
      # codec: "mpeg4"
      # output_params: ["-q:v", "5"]
      #
      # Средний компромисс по размеру и качеству:
      # format: "mp4"
      # codec: "mpeg4"
      # output_params: ["-q:v", "2"]
      #
      fps: 60
      format: "mkv"
      codec: "ffv1"
      output_params: []
    auto_placement: true
    robot_base_pose_z_auto: true
    object_spawn_clearance: null
    bg_collision_mode: "nonconvex"
    bg_use_decimated_collision_mesh: true
    bg_collision_mesh: "background_registered_collision.glb"
    obj_collision_mode: "coacd"
    physx_contact_offset: 0.005
    physx_rest_offset: 0.0
    placement_mode: "fixed"
    return_home: false
    cameras:
      base_camera:
        use_scene_json: true
      render_camera:
        use_base_camera: true
        eye: [0.8, 0.8, 0.6]
        target: [0, 0, 0.2]
        width: 512
        height: 512
        fov: 1.047
      custom_cameras: []

